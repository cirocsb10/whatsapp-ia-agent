version: "3.9"

services:
  postgres-test:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: whatsagent_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7.2-alpine
    ports:
      - "6380:6379"
    command: redis-server

  rabbitmq-test:
    image: rabbitmq:3.12-alpine
    ports:
      - "5673:5672"
